services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/data/dev.db
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/order-confirmation
      - AGENT_SERVER_URL=http://agent-server:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - web_data:/data
      - ./src:/app/src
      - ./public:/app/public
      - ./prisma:/app/prisma
      - ./next.config.ts:/app/next.config.ts
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    restart: unless-stopped

  agent-server:
    build: ./agent-server
    ports:
      - "8000:8000"
    env_file:
      - ./agent-server/.env
    environment:
      - NEXTJS_API_URL=http://web:3000
      - N8N_INTERNAL_URL=http://n8n:5678
    volumes:
      - ./agent-server:/app
    command: uvicorn agent:app --host 0.0.0.0 --port 8000 --reload
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - AGENT_SERVER_URL=http://agent-server:8000
      - NEXTJS_URL=http://web:3000
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  web_data:
  n8n_data:
